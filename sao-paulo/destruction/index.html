<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<base href="/sao-paulo/destruction/">
<title>Destruction Lab</title>
<meta name="description" content="The Deep End: a fictional 85-storey tower on the Balneário Camboriú beachfront tips into the Atlantic, raises a surge and settles as a wreck you can swim around. Destruction Dynamics, Rapier physics and a shallow-water ocean in your browser.">
<meta property="og:title" content="São Paulo World · Destruction Lab">
<meta property="og:description" content="An 85-storey tower tips into the ocean. Watch the surge, then swim the wreck.">
<meta property="og:image" content="https://zrossermcintosh.com/sao-paulo/img/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='7' width='30' height='18' rx='3' fill='%230a3a8c' stroke='white' stroke-width='2'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='900' font-size='11' text-anchor='middle' fill='white'%3ESP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1217;--panel:#0d1217db;--fg:#e7edf2;--muted:#9aa8b4;--accent:#4fb3c9;--danger:#e2574c;--border:#ffffff1f;--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}*{box-sizing:border-box}html,body{background:var(--bg);height:100%;color:var(--fg);margin:0;font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#viewport{position:fixed;inset:0}#viewport canvas{display:block}#panel{background:var(--panel);border:1px solid var(--border);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:10px;flex-direction:column;gap:10px;width:300px;padding:12px 14px;display:flex;position:fixed;top:12px;bottom:12px;right:12px;overflow-y:auto}h1{letter-spacing:.02em;margin:0;font-size:15px}.sub{color:var(--muted);margin:2px 0 0;font-size:12px}label{color:var(--muted);flex-direction:column;gap:4px;font-size:12px;display:flex}label.check{color:var(--fg);flex-direction:row;align-items:center;gap:6px}select,input[type=number]{color:var(--fg);border:1px solid var(--border);font:inherit;background:#151c23;border-radius:6px;padding:5px 6px}input[type=range]{width:100%;accent-color:var(--accent)}.row{gap:6px;display:flex}.buttons button{flex:1}button{color:var(--fg);border:1px solid var(--border);font:inherit;cursor:pointer;background:#1b252e;border-radius:6px;padding:6px 8px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#062029;border-color:#0000;font-weight:600}.grid2{grid-template-columns:1fr 1fr;gap:8px;display:grid}fieldset{border:1px solid var(--border);border-radius:8px;gap:4px;padding:6px 10px;display:grid}legend{color:var(--muted);padding:0 4px;font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}#stats{white-space:pre-wrap;color:#c8d3dc;background:#00000040;border-radius:6px;margin:0;padding:8px}.hint{color:var(--muted);margin:0;font-size:11px}.markers{height:10px;margin-top:-6px;position:relative}.markers span{background:var(--accent);width:1px;height:8px;position:absolute;top:0}#banner{background:var(--danger);color:#fff;border-radius:8px;max-width:50vw;padding:8px 12px;font-size:12px;position:fixed;bottom:12px;left:12px}@media (max-width:720px){#panel{width:auto;height:46vh;top:auto;left:8px;right:8px}}

/* São Paulo World skin */
:root{--bg:#0b111b;--panel:rgba(10,17,28,.86);--fg:#e7ecf2;--muted:#93a0b2;--accent:#1d57c2;--border:rgba(255,255,255,.12);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
html,body{font-family:var(--body)}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase}
.mono,#stats{font-family:var(--mono)}
button.primary{color:#fff}
.back{color:var(--muted);text-decoration:none;font-size:12px}
.back:hover{color:var(--fg)}
#panel{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
</style>
<script type="module" crossorigin src="./assets/app.js"></script>
</head>
<body>
<div id="viewport"></div>
    <aside id="panel" aria-label="Simulation controls">
      <header>
        <a class="back" href="../">← São Paulo World</a>
        <h1>Destruction Lab</h1>
        <p class="sub">The Deep End · Balneário Camboriú · prototype</p>
      </header>

      <label
        >Scenario
        <select id="scenario">
          <option value="the-deep-end" selected>The Deep End (tower → ocean)</option>
          <option value="bridge" disabled>São Paulo bridge (planned)</option>
          <option value="salvage" disabled>Underwater salvage (planned)</option>
        </select>
      </label>

      <div class="row buttons">
        <button id="btn-play" class="primary" title="Arm the event: cancellable preparation, then collapse">
          Play
        </button>
        <button id="btn-trigger" title="Commit immediately, skipping preparation">Trigger now</button>
        <button id="btn-cancel" title="Cancel during preparation">Cancel</button>
      </div>
      <div class="row buttons">
        <button id="btn-pause">Pause</button>
        <button id="btn-reset">Reset</button>
        <button id="btn-restore" title="Begin restoration now instead of waiting 24 h">Restore now</button>
      </div>

      <label
        >Timeline <span id="timeline-label" class="mono">—</span>
        <input id="timeline" type="range" min="-5" max="70" step="0.05" value="-5" />
      </label>
      <div id="stage-markers" class="markers" aria-hidden="true"></div>

      <div class="grid2">
        <label
          >Speed
          <select id="speed">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
            <option value="8">8×</option>
          </select>
        </label>
        <label
          >Quality
          <select id="quality">
            <option value="dorito">Potato (Dorito)</option>
            <option value="balanced" selected>Balanced</option>
            <option value="high">High</option>
            <option value="cinematic">Cinematic</option>
          </select>
        </label>
        <label
          >Camera
          <select id="camera">
            <option value="cinematic" selected>Cinematic director</option>
            <option value="free">Free</option>
            <option value="street">Street level</option>
            <option value="offshore">Offshore</option>
            <option value="underwater">Underwater</option>
            <option value="follow">Follow debris</option>
          </select>
        </label>
        <label
          >Seed
          <input id="seed" type="number" value="1234" />
        </label>
      </div>

      <fieldset>
        <legend>Overlays</legend>
        <label class="check"><input id="toggle-physics" type="checkbox" /> Physics bodies</label>
        <label class="check"><input id="toggle-water" type="checkbox" /> Water near-field</label>
        <label class="check"><input id="toggle-collision" type="checkbox" /> Tower collision</label>
        <label class="check"><input id="toggle-audio" type="checkbox" checked /> Audio (procedural)</label>
      </fieldset>

      <div class="row buttons">
        <button id="btn-save">Save state</button>
        <button id="btn-load">Load state</button>
      </div>

      <pre id="stats" class="mono" aria-live="off"></pre>
      <p class="hint">
        Free camera: drag to orbit, scroll to zoom. Underwater: drag to look, WASD to swim, E/Q up/down, Shift
        fast.
      </p>
    </aside>
    <div id="banner" hidden></div>
</body>
</html>
